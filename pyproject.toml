[project]
name = "video-previewer"
version = "0.1.0"
description = "Minimal cross-platform desktop app for browsing and previewing local videos"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyside6>=6.6",
    "pyyaml>=6.0",
]

[project.scripts]
video-preview = "video_previewer.main:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/video_previewer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
