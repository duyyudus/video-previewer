[project]
name = "video-previewer"
version = "0.1.0"
description = "Minimal cross-platform desktop app for browsing and previewing local videos"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyside6>=6.6",
    "pyyaml>=6.0",
]

[project.scripts]
video-preview = "video_previewer.main:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/video_previewer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# Minimal on purpose: the Pyflakes/pycodestyle baseline plus exactly the
# rule families the code already carries ``# noqa`` for (E402 late imports,
# N802 Qt method names, BLE001 fail-soft excepts, S606 os.startfile), so the
# directives stay enforced without forcing a whole-tree reformat.
select = ["E4", "E7", "E9", "F", "N", "BLE001", "S606"]
